name: Java CI

on:
  push:
    branches: [master, main, water]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify change classification
        run: python3 -m unittest discover -s scripts -p test_ci_changes.py

      # Keep the existing check present even for documentation-only PRs.
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py

      - name: Set up Java 21
        if: steps.changes.outputs.verify == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run verification
        if: steps.changes.outputs.verify == 'true'
        working-directory: backend
        env:
          RUN_MYSQL_TESTS: 'true'
        run: sh ./mvnw -B -ntp clean verify
